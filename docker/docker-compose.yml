networks:
  transcendence:
    driver: bridge

services:
  frontend:
    build:
      context: ..
      dockerfile: docker/frontend/Dockerfile
    container_name: frontend
    ports: 
      - "5173:5173"
    networks:
      - transcendence
  nginx:
    image: nginx
    build: nginx/.
    container_name: nginx
    ports:
      - "443:443"
    restart: always