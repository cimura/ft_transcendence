networks:
  transcendence:
    driver: bridge

services:
  frontend:
    build:
      context: ../frontend
      dockerfile: ../docker/frontend/Dockerfile
    container_name: frontend
    volumes:
      - ../frontend:/app
      - frontend_node_modules:/app/node_modules
    networks:
      - transcendence
  backend:
    build: 
      context: ../backend
      dockerfile: ../docker/backend/Dockerfile
    container_name: backend
    volumes:
      - ../backend:/app
      - backend_node_modules:/app/node_modules
    networks:
      - transcendence
  nginx:
    image: nginx
    build:
      context: nginx
    container_name: nginx
    ports:
      - "443:443"
    restart: always
    depends_on:
      - frontend
      - backend
    networks:
      - transcendence

volumes:
  frontend_node_modules:
  backend_node_modules:
