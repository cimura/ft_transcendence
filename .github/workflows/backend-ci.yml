name: Backend CI

on:
  pull_request:
    paths:
      - "backend/**"
  push:
    branches:
      - main
      - develop
    paths:
      - "backend/**"

jobs:
  lint-format-and-test:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: "postgresql://transcendence:transcendence@postgres:5432/transcendence?schema=public"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --workspace=backend --workspace=shared

      - name: Generate Prisma Client
        run: npm --workspace=backend exec prisma -- generate

      - name: Run ESLint
        run: npm --workspace=backend run lint

      - name: Check code formatting
        run: npm --workspace=backend run format:check

      - name: Run test
        run: npm --workspace=backend run test
