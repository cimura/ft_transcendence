name: AI PR Agent
on:
  pull_request:
    types: [opened, synchronize]
  issue_comment:
    types: [created] # コメントでAIに指示を出すことも可能になります

jobs:
  pr_agent:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: write
    steps:
      - name: PR Agent action
        uses: Codium-ai/pr-agent@main
        env:
          # Gemini API key configuration
          GOOGLE_AI_STUDIO.GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Japanese response configuration
          PR_DESCRIPTION.MAIN_INSTRUCTION: "日本語で要約してください。"
          PR_REVIEWER.EXTRA_INSTRUCTIONS: "必ず日本語でレビューしてください。細かいバグの可能性や、命名規則、変更点について指摘して。"
          # Model configuration (requires gemini/ prefix)
          config.model: "gemini/gemini-2.5-flash"
          # Disable fallback to OpenAI models
          config.fallback_models: '["gemini/gemini-2.5-flash"]'
          # Enable automatic actions
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "true"
          github_action_config.auto_improve: "true"
          # Run on synchronize events (code updates)
          github_action_config.pr_actions: '["opened", "reopened", "ready_for_review", "review_requested", "synchronize"]'